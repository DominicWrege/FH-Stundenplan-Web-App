<div
  class="app-shell"
  (touchstart)="onSwipeStart($event)"
  (touchmove)="onSwipeMove($event)"
  (touchend)="onSwipeEnd($event)"
  (touchcancel)="onSwipeCancel($event)"
>
  <header class="app-header">
    <mat-toolbar class="toolbar">
      <span class="title">FH-Stundenplan</span>
      <button mat-icon-button (click)="toggleSettings()" aria-label="Einstellungen">
        <mat-icon>settings</mat-icon>
      </button>
    </mat-toolbar>
    <nav mat-tab-nav-bar [tabPanel]="panel" class="tabs">
      @for (day of weekdays; track day; let i = $index) {
        <a mat-tab-link (click)="selectDay(i)" [active]="store.selectedDay() === i">
          {{ labels[day] }}
        </a>
      }
    </nav>
    <mat-tab-nav-panel #panel />
  </header>
  <main>
    @for (day of weekdays; track day; let i = $index) {
      <app-timetable [weekday]="day" [active]="store.selectedDay() === i" />
    }
  </main>
</div>
